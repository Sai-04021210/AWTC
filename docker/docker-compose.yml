version: '3'

services:
  awlc:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: awlc
    ports:
      - "1880:1880"  # Node-RED web interface
      - "1884:1883"  # MQTT broker (using port 1884 on host to avoid conflict)
      - "9001:9001"  # MQTT websockets (if needed)
    volumes:
      - ../node-red/flows:/app/node-red/flows
      - node_red_data:/root/.node-red
    restart: unless-stopped

volumes:
  node_red_data:
